# Le 100 citta' in cui l'associazione ha volontari.
#
# I punti vendita NON si elencano piu' a mano: si importano da OpenStreetMap
# con ops/scripts/importa_negozi_osm.py, che usa questo elenco per sapere dove
# cercare. I CAP non servono all'importazione e non sono elencati: arrivano dal
# dato OSM quando c'e'.
#
# Aggiungere una citta' = una voce qui, poi rilanciare l'importatore.
#
# I codici provincia vanno fra virgolette: senza, YAML legge NO (Novara) come
# il booleano falso. E' la stessa trappola per cui la Norvegia sparisce dai
# file di configurazione scritti male.

