# Impostazioni della pipeline. Nessun segreto qui: le chiavi API stanno
# esclusivamente in variabili d'ambiente (vedi .env.example).

storage:
  flyers_dir: "storage/flyers"
  pages_dir: "storage/pages"
  legal_dir: "storage/legal"
  logs_dir: "storage/logs"

rasterize:
  dpi: 200
  format: png
  max_width_px: 1568        # oltre questa soglia l'immagine viene ridimensionata

extraction:
  model: "claude-opus-5"
  prompt_file: "prompts/extraction.md"
  use_batch_api: true
  max_output_tokens: 8000
  max_attempts: 2           # oltre: la pagina va in review_queue

matching:
  model: "claude-opus-5"
  prompt_file: "prompts/matching.md"
  auto_accept_score: 0.92   # sopra: match automatico
  llm_review_score: 0.70    # tra le due soglie: si interpella il modello
  # sotto llm_review_score: nessun match, l'offerta resta non abbinata

# Listino usato SOLO per stimare il costo in api_calls.cost_usd.
# Va allineato a mano al listino pubblico; non viene letto dall'API.
pricing_usd_per_mtok:
  claude-opus-5:
    input: 5.00
    output: 25.00
    cache_write: 6.25
    cache_read: 0.50
  batch_discount: 0.5       # la Batch API costa meta'

# Il documento e' un artefatto di lavorazione, non un archivio: a estrazione
# completata i byte si possono cancellare. L'hash resta in flyers.file_hash e
# la deduplica continua a funzionare.
retention:
  purge_documents_after_extraction: true
  keep_page_images_days: 14      # utili solo per la revisione manuale
