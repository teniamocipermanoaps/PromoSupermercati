[project]
name = "osservatorio-promo"
version = "0.1.0"
description = "Raccolta e analisi delle offerte promozionali della GDO italiana"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "playwright>=1.45",
    "PyMuPDF>=1.24",
    "anthropic>=0.40",
    "rapidfuzz>=3.9",
    "PyMySQL>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
osservatorio = "osservatorio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
