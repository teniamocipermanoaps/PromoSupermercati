# OsservatorioPromo - Apache + mod_php o PHP-FPM
#
# Per un server proprio: copiare in /etc/apache2/sites-available/ e
#   a2enmod rewrite headers ssl
#   a2ensite osservatoriopromo && systemctl reload apache2
#   certbot --apache -d osservatorio.esempio.it
#
# Su hosting condiviso non si tocca il vhost: si usa il .htaccess descritto
# in docs/messa-in-opera.md, e si punta il dominio a dashboard/public.

<VirtualHost *:80>
    ServerName osservatorio.esempio.it
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName osservatorio.esempio.it

    # ATTENZIONE: la radice e' dashboard/public, NON la radice del progetto.
    # Puntandola alla radice del progetto, .env diventa scaricabile.
    DocumentRoot /srv/osservatoriopromo/dashboard/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/osservatorio.esempio.it/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/osservatorio.esempio.it/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"

    <Directory /srv/osservatoriopromo/dashboard/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Il router e' scritto a mano: ogni percorso che non e' un file vero
        # deve arrivare a index.php, altrimenti /punti-vendita/1 da' 404.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    # Niente file nascosti.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/osservatoriopromo.error.log
    CustomLog ${APACHE_LOG_DIR}/osservatoriopromo.access.log combined
</VirtualHost>
