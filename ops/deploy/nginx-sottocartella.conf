# OsservatorioPromo dentro un sito che esiste gia'
#   https://gestionaletpmo.it/promosupermercati
#
# L'impianto e' questo:
#
#   /srv/osservatoriopromo/                         il clone, FUORI dalla radice web
#   /var/www/gestionaletpmo.it/promosupermercati ->  collegamento simbolico a
#                                                    /srv/osservatoriopromo/dashboard/public
#
#   ln -s /srv/osservatoriopromo/dashboard/public \
#         /var/www/gestionaletpmo.it/promosupermercati
#
# Cosi' la radice web contiene solo la cartella pubblica: .env, db/, crawler/ e
# la cartella .git restano irraggiungibili dal browser perche' stanno altrove,
# non perche' una regola li nasconde. Le regole si dimenticano.
#
# In .env deve esserci:  APP_BASE_PATH=/promosupermercati
# Se i due valori non coincidono, si gira a vuoto fra la pagina di accesso e le
# altre e sembra che l'applicazione sia rotta.

server {
    listen 80;
    listen [::]:80;
    server_name gestionaletpmo.it;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gestionaletpmo.it;

    root /var/www/gestionaletpmo.it;
    index index.php index.html;

    ssl_certificate     /etc/letsencrypt/live/gestionaletpmo.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestionaletpmo.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # --- OsservatorioPromo -------------------------------------------------
    # Il router e' scritto a mano: ogni percorso sotto /promosupermercati che
    # non e' un file vero deve arrivare a index.php dell'applicazione.
    location /promosupermercati/ {
        try_files $uri $uri/ /promosupermercati/index.php$is_args$args;
    }

    location = /promosupermercati {
        return 301 /promosupermercati/;
    }

    location ~ ^/promosupermercati/.+\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;

        # Dice a PHP che la connessione originale era cifrata: senza, il cookie
        # di sessione non riceve il flag Secure.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }
    # -----------------------------------------------------------------------

    # Il resto di gestionaletpmo.it, come gia' configurato.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. { deny all; return 404; }

    access_log /var/log/nginx/gestionaletpmo.access.log;
    error_log  /var/log/nginx/gestionaletpmo.error.log;
}
