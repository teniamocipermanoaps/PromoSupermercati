# OsservatorioPromo - nginx + PHP-FPM
#
# Copiare in /etc/nginx/sites-available/osservatoriopromo, adattare
# server_name e root, poi:
#   ln -s /etc/nginx/sites-available/osservatoriopromo /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Il certificato lo mette certbot:
#   certbot --nginx -d osservatorio.esempio.it

server {
    listen 80;
    listen [::]:80;
    server_name osservatorio.esempio.it;

    # Unica cosa servita in chiaro: la verifica di Let's Encrypt.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name osservatorio.esempio.it;

    # ATTENZIONE: la radice e' dashboard/public, NON la radice del progetto.
    # Puntandola alla radice del progetto, .env diventa scaricabile da chiunque
    # e con esso le credenziali del database.
    root /srv/osservatoriopromo/dashboard/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/osservatorio.esempio.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osservatorio.esempio.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Il browser ricorda di non tornare mai in chiaro su questo dominio.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Il router e' scritto a mano: ogni percorso che non e' un file vero deve
    # arrivare a index.php. Senza questa riga /punti-vendita/1 da' 404 e
    # sembra che l'applicazione sia rotta.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;

        # Dice a PHP che la connessione originale era cifrata: senza, il
        # cookie di sessione non riceve il flag Secure.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    # Niente file nascosti, a nessuna condizione.
    location ~ /\. { deny all; return 404; }

    access_log /var/log/nginx/osservatoriopromo.access.log;
    error_log  /var/log/nginx/osservatoriopromo.error.log;
}
